version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: store-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: store_api
      MYSQL_USER: storeuser
      MYSQL_PASSWORD: storepassword

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

    container_name: store-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  store-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env

    container_name: store-api

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    ports:
      - "8080:8080"
      - "8081:8081"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/store_api?createDatabaseIfNotExist=true

      DB_USERNAME: storeuser

      DB_PASSWORD: storepassword

      SECRET_KEY: your-secret-key

      EXPIRATION: 86400

      REDIS_HOST: redis

      REDIS_PORT: 6379

      REDIS_URL: redis://redis:6379

      REDIS_USERNAME:

      REDIS_PASSWORD:

      PAYSTACK_SECRET_KEY: xxxxxxxxx

      FLUTTERWAVE_SECRET_KEY: xxxxxxxxx

      TERMII_BASE_URL: xxxxxxxxx

      TERMII_API_KEY: xxxxxxxxx

      TERMII_SENDER_ID: xxxxxxxxx

      BREVO_API_KEY: xxxxxxxxx

      EMAIL_USERNAME: xxxxxxxxx

      EMAIL_PASSWORD: xxxxxxxxx

      EMAIL_PORT: 587

      FRONTEND_URL: http://localhost:5173

      STRIPE_SECRET_KEY: xxxxxxxxx

      STRIPE_WEBHOOK_SECRET_KEY: xxxxxxxxx

      RESET_PASSWORD_SALT: xxxxxxxxx

      RESET_SECRET_KEY: xxxxxxxxx

      VERIFY_EMAIL_SALT: xxxxxxxxx

      VERIFY_EMAIL_SECRET_KEY: xxxxxxxxx

      CORS_ALLOWED_ORIGINS: http://localhost:5173

volumes:
  mysql_data:

  redis_data:
